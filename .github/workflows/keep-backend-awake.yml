name: Keep backend awake

# Render free tier sleeps after ~15 min idle, causing 30-60s cold starts.
# Ping the health endpoint every 10 minutes so students get fast responses.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Ping API health
        run: curl -fsS --max-time 90 https://study-app-b0xq.onrender.com/health/live || curl -fsS --max-time 90 https://study-app-b0xq.onrender.com/health

