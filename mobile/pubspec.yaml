name: study_app_mobile
description: "StudyApp is a focused, cross-platform learning companion for courses, quizzes, notes, and AI tutoring."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.13.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  dio: ^5.11.1
  shared_preferences: ^2.5.5
  google_fonts: ^8.2.1
  flutter_svg: ^2.0.17
  file_picker: ^12.3.0
  uuid: ^4.6.0
  intl: ^0.20.3
  flutter_animate: ^4.5.2
  image_picker: ^1.1.2
  google_sign_in: ^6.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

dependency_overrides:
  path_provider_foundation: 2.4.1
  path_provider_android: 2.2.15

flutter:
  uses-material-design: true
  assets:
    - assets/images/studyapp_logo.png
    - assets/images/studyapp_logo.svg
