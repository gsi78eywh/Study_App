<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="StudyApp - Student Learning, Spaced Recall & Exam Mastery">
  <meta name="theme-color" content="#0B0F19">
  <meta name="google-signin-client_id" content="717073834269-9tegppvpc37rd197rmjpkabc108rb9uj.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StudyApp | Student Learning & Exam Mastery</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1E1B4B 0%, #0B0F19 75%);
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
    }

    #app-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
      max-width: 360px;
      width: 90%;
    }

    .logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(99, 102, 241, 0) 70%);
      animation: pulseGlow 2.4s ease-in-out infinite;
    }

    .logo-badge {
      position: relative;
      width: 82px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon {
      width: 82px;
      height: 82px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 30%, #C7D2FE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .brand-tagline {
      font-size: 13px;
      font-weight: 400;
      color: #94A3B8;
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }

    .loader-track {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      background: linear-gradient(90deg, #6366F1, #A855F7);
      border-radius: 999px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    .loading-status {
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
      animation: pulseText 1.8s ease-in-out infinite alternate;
    }

    @keyframes indeterminate {
      0% {
        left: -45%;
      }
      50% {
        left: 35%;
      }
      100% {
        left: 100%;
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.85;
      }
    }

    @keyframes pulseText {
      0% {
        opacity: 0.6;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <!-- Branded Instant Splash Screen to prevent blank white page flash -->
  <div id="app-splash">
    <div class="splash-card">
      <div class="logo-container">
        <div class="logo-glow"></div>
        <div class="logo-badge">
          <img class="logo-icon" src="icons/Icon-192.png" alt="StudyApp logo">
        </div>
      </div>
      <h1 class="brand-title">StudyApp</h1>
      <p class="brand-tagline">AI Study Companion & Spaced Recall</p>
      <div class="loader-track">
        <div class="loader-bar"></div>
      </div>
      <span class="loading-status">Loading study workspace...</span>
    </div>
  </div>

  <script>
    // Smooth splash dismiss once Flutter finishes mounting its initial frame
    function dismissSplash() {
      const splash = document.getElementById('app-splash');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }
    }

    // 1. Primary event dispatched by Flutter Web engine
    window.addEventListener('flutter-first-frame', dismissSplash);

    // 2. Fallback observer if first-frame is dispatched before listener or missed
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
        setTimeout(dismissSplash, 120);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Safety timeout guarantee (max 10s)
    setTimeout(dismissSplash, 10000);

    // 4. Global Clipboard Screenshot Paste Listener & Fast Client-Side OCR (Seth AI Vision)
    window._studyAppLastPastedImage = null;

    window.addEventListener('paste', function(event) {
      try {
        var items = (event.clipboardData || (event.originalEvent && event.originalEvent.clipboardData) || {}).items;
        if (!items) return;
        for (var i = 0; i < items.length; i++) {
          if (items[i].type && items[i].type.indexOf('image/') === 0) {
            var blob = items[i].getAsFile();
            if (!blob) continue;
            var reader = new FileReader();
            reader.onload = function(e) {
              var dataUrl = e.target.result || '';
              var commaIdx = dataUrl.indexOf(',');
              var base64 = commaIdx >= 0 ? dataUrl.substring(commaIdx + 1) : dataUrl;
              window._studyAppLastPastedImage = JSON.stringify({
                base64: base64,
                mimeType: blob.type || 'image/png',
                name: 'pasted_screenshot_' + Date.now() + '.png',
                timestamp: Date.now()
              });
            };
            reader.readAsDataURL(blob);
            break;
          }
        }
      } catch (err) {
        console.warn('Clipboard paste capture warning:', err);
      }
    });

    window.studyAppConsumePastedImage = function() {
      var val = window._studyAppLastPastedImage;
      window._studyAppLastPastedImage = null;
      return val || '';
    };

    window.studyAppReadClipboardImage = async function() {
      try {
        if (window._studyAppLastPastedImage) {
          var cached = window._studyAppLastPastedImage;
          window._studyAppLastPastedImage = null;
          return cached;
        }
        if (navigator.clipboard && navigator.clipboard.read) {
          var items = await navigator.clipboard.read();
          for (var i = 0; i < items.length; i++) {
            var types = items[i].types || [];
            for (var j = 0; j < types.length; j++) {
              if (types[j].indexOf('image/') === 0) {
                var blob = await items[i].getType(types[j]);
                return await new Promise(function(resolve) {
                  var reader = new FileReader();
                  reader.onload = function(e) {
                    var dataUrl = e.target.result || '';
                    var commaIdx = dataUrl.indexOf(',');
                    var base64 = commaIdx >= 0 ? dataUrl.substring(commaIdx + 1) : dataUrl;
                    resolve(JSON.stringify({
                      base64: base64,
                      mimeType: types[j],
                      name: 'clipboard_screenshot.png',
                      timestamp: Date.now()
                    }));
                  };
                  reader.onerror = function() { resolve(''); };
                  reader.readAsDataURL(blob);
                });
              }
            }
          }
        }
      } catch (e) {
        console.warn('Clipboard read image fallback:', e);
      }
      return '';
    };

    // Preprocess screenshot/camera image for high-clarity OCR (handles dark-mode screenshots & low contrast)
    async function preprocessImageForOcr(dataUrl) {
      return new Promise(function(resolve) {
        var img = new Image();
        img.crossOrigin = 'anonymous';
        img.onload = function() {
          try {
            var scale = (img.width < 1000 && img.height < 1000) ? 2.0 : 1.0;
            var canvas = document.createElement('canvas');
            canvas.width = Math.max(1, Math.round(img.width * scale));
            canvas.height = Math.max(1, Math.round(img.height * scale));
            var ctx = canvas.getContext('2d');
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);

            var imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
            var d = imgData.data;
            var totalLum = 0;
            var pixelCount = d.length / 4;
            for (var i = 0; i < d.length; i += 4) {
              var lum = 0.299 * d[i] + 0.587 * d[i + 1] + 0.114 * d[i + 2];
              totalLum += lum;
            }
            var avgLum = totalLum / Math.max(1, pixelCount);
            var isDarkBg = avgLum < 118;

            // Convert to high-contrast grayscale (and invert if dark-mode screenshot)
            for (var j = 0; j < d.length; j += 4) {
              var g = 0.299 * d[j] + 0.587 * d[j + 1] + 0.114 * d[j + 2];
              if (isDarkBg) g = 255 - g;
              // Contrast stretch
              var stretched = (g - 128) * 1.45 + 128;
              var finalVal = Math.max(0, Math.min(255, Math.round(stretched)));
              d[j] = finalVal;
              d[j + 1] = finalVal;
              d[j + 2] = finalVal;
            }
            ctx.putImageData(imgData, 0, 0);
            resolve(canvas.toDataURL('image/png'));
          } catch (err) {
            resolve(dataUrl);
          }
        };
        img.onerror = function() { resolve(dataUrl); };
        img.src = dataUrl;
      });
    }

    async function ensureTesseractLoaded() {
      if (window.Tesseract) return true;
      return new Promise(function(resolve) {
        var s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';
        s.async = true;
        s.onload = function() { resolve(!!window.Tesseract); };
        s.onerror = function() { resolve(false); };
        document.head.appendChild(s);
      });
    }

    window.studyAppExtractTextFromImage = async function(base64Data, mimeType) {
      try {
        var cleanMime = (mimeType && mimeType.indexOf('image/') === 0) ? mimeType : 'image/png';
        var rawDataUrl = base64Data.indexOf('data:') === 0
          ? base64Data
          : ('data:' + cleanMime + ';base64,' + base64Data);

        var processedDataUrl = await preprocessImageForOcr(rawDataUrl);

        // Race OCR.space Engine 2 (ultra-fast 1.5s cloud OCR for screenshots) and Tesseract.js v5 (offline/browser OCR)
        var ocrSpacePromise = (async function() {
          try {
            var form = new FormData();
            form.append('apikey', 'helloworld');
            form.append('base64Image', rawDataUrl);
            form.append('language', 'eng');
            form.append('scale', 'true');
            form.append('isTable', 'true');
            form.append('OCREngine', '2');
            var resp = await fetch('https://api.ocr.space/parse/image', {
              method: 'POST',
              body: form
            });
            if (!resp.ok) return '';
            var json = await resp.json();
            if (json && Array.isArray(json.ParsedResults) && json.ParsedResults.length > 0) {
              var text = json.ParsedResults.map(function(r) { return (r.ParsedText || '').trim(); }).join('\n').trim();
              if (text.length >= 8) return text;
            }
          } catch (_) {}
          return '';
        })();

        var fastCloudText = await Promise.race([
          ocrSpacePromise,
          new Promise(function(r) { setTimeout(function() { r(''); }, 4500); })
        ]);
        if (fastCloudText && fastCloudText.length >= 10) {
          return fastCloudText;
        }

        var loaded = await ensureTesseractLoaded();
        if (loaded && window.Tesseract) {
          var res = await window.Tesseract.recognize(processedDataUrl, 'eng');
          var tesseractText = (res && res.data && res.data.text) ? res.data.text.trim() : '';
          if (tesseractText.length >= 5) {
            return tesseractText;
          }
        }

        var fallbackCloud = await ocrSpacePromise;
        return fallbackCloud || '';
      } catch (err) {
        console.warn('studyAppExtractTextFromImage error:', err);
        return '';
      }
    };
  </script>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.getRegistrations().then(function(registrations) {
        for (var registration of registrations) {
          registration.update();
        }
      });
    }
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
