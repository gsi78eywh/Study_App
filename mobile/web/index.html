<!DOCTYPE html>
<html lang="en">
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="description" content="StudyApp - Student Learning, Spaced Recall & Exam Mastery">
  <meta name="theme-color" content="#0B0F19">
  <meta name="google-signin-client_id" content="717073834269-9tegppvpc37rd197rmjpkabc108rb9uj.apps.googleusercontent.com">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="StudyApp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>StudyApp | Student Learning & Exam Mastery</title>
  <link rel="manifest" href="manifest.json">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0B0F19;
      color: #F8FAFC;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }

    #app-splash {
      position: fixed;
      inset: 0;
      z-index: 999999;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at 50% 30%, #1E1B4B 0%, #0B0F19 75%);
      transition: opacity 0.4s cubic-bezier(0.4, 0, 0.2, 1), visibility 0.4s ease;
    }

    #app-splash.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .splash-card {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      padding: 32px;
      max-width: 360px;
      width: 90%;
    }

    .logo-container {
      position: relative;
      width: 80px;
      height: 80px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-glow {
      position: absolute;
      inset: -12px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.4) 0%, rgba(99, 102, 241, 0) 70%);
      animation: pulseGlow 2.4s ease-in-out infinite;
    }

    .logo-badge {
      position: relative;
      width: 82px;
      height: 82px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo-icon {
      width: 82px;
      height: 82px;
      object-fit: contain;
    }

    .brand-title {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      background: linear-gradient(135deg, #FFFFFF 30%, #C7D2FE 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .brand-tagline {
      font-size: 13px;
      font-weight: 400;
      color: #94A3B8;
      margin-bottom: 28px;
      letter-spacing: 0.2px;
    }

    .loader-track {
      width: 140px;
      height: 4px;
      background: rgba(255, 255, 255, 0.08);
      border-radius: 999px;
      overflow: hidden;
      position: relative;
      margin-bottom: 14px;
    }

    .loader-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 45%;
      background: linear-gradient(90deg, #6366F1, #A855F7);
      border-radius: 999px;
      animation: indeterminate 1.4s ease-in-out infinite;
    }

    .loading-status {
      font-size: 12px;
      color: #64748B;
      font-weight: 500;
      animation: pulseText 1.8s ease-in-out infinite alternate;
    }

    @keyframes indeterminate {
      0% {
        left: -45%;
      }
      50% {
        left: 35%;
      }
      100% {
        left: 100%;
      }
    }

    @keyframes pulseGlow {
      0%, 100% {
        transform: scale(0.9);
        opacity: 0.5;
      }
      50% {
        transform: scale(1.15);
        opacity: 0.85;
      }
    }

    @keyframes pulseText {
      0% {
        opacity: 0.6;
      }
      100% {
        opacity: 1;
      }
    }
  </style>
</head>
<body>
  <!-- Branded Instant Splash Screen to prevent blank white page flash -->
  <div id="app-splash">
    <div class="splash-card">
      <div class="logo-container">
        <div class="logo-glow"></div>
        <div class="logo-badge">
          <img class="logo-icon" src="icons/Icon-192.png" alt="StudyApp logo">
        </div>
      </div>
      <h1 class="brand-title">StudyApp</h1>
      <p class="brand-tagline">AI Study Companion & Spaced Recall</p>
      <div class="loader-track">
        <div class="loader-bar"></div>
      </div>
      <span class="loading-status">Loading study workspace...</span>
    </div>
  </div>

  <script>
    // Smooth splash dismiss once Flutter finishes mounting its initial frame
    function dismissSplash() {
      const splash = document.getElementById('app-splash');
      if (splash && !splash.classList.contains('hidden')) {
        splash.classList.add('hidden');
        setTimeout(function() {
          if (splash.parentNode) splash.parentNode.removeChild(splash);
        }, 500);
      }
    }

    // 1. Primary event dispatched by Flutter Web engine
    window.addEventListener('flutter-first-frame', dismissSplash);

    // 2. Fallback observer if first-frame is dispatched before listener or missed
    var observer = new MutationObserver(function(mutations, obs) {
      if (document.querySelector('flt-glass-pane') || document.querySelector('flutter-view')) {
        setTimeout(dismissSplash, 120);
        obs.disconnect();
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });

    // 3. Safety timeout guarantee (max 10s)
    setTimeout(dismissSplash, 10000);
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
