databases:
  - name: studyapp-db
    databaseName: studyapp
    user: studyapp
    plan: free

services:
  - type: web
    name: studyapp-api
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /health/live
    envVars:
      - key: ASPNETCORE_ENVIRONMENT
        value: Production
      - key: JwtSettings__Secret
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: studyapp-db
          property: connectionString
      - key: CORS_ALLOWED_ORIGINS
        value: https://studyapp-51772.web.app,https://studyapp-51772.firebaseapp.com
